<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영 콘솔 시작 화면</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 960px; line-height: 1.5; }
  fieldset { margin-bottom: 1rem; }
  pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
</style>
</head>
<body>
<!-- 제공 시작 화면. 로그인과 지금 정책 보기만 있습니다. 정책 편집·사건 조회·대응 승인·복구 화면은 직접 만드세요.
     화면의 "성공" 표시는 판정 근거가 아닙니다. 늘 서버 응답을 그대로 보여 주세요. 토큰은 메모리에만 두고 저장하지 않습니다. -->
<h1>운영 콘솔</h1>
<fieldset>
  <legend>로그인</legend>
  <input id="email" type="email" placeholder="이메일" autocomplete="username">
  <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="login">로그인</button>
</fieldset>
<button id="health">서버 상태</button>
<button id="policy">지금 정책</button>
<pre id="out">아직 요청하지 않았습니다.</pre>
<script type="module">
  const base = '/api/product/v1';
  let token = null;
  const out = document.getElementById('out');
  async function call(method, path, body) {
    const res = await fetch(base + path, {
      method,
      headers: { 'content-type': 'application/json', ...(token ? { authorization: `Bearer ${token}` } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    out.textContent = `${res.status}\n${text}`;
    return { status: res.status, body: text ? JSON.parse(text) : null };
  }
  document.getElementById('login').onclick = async () => {
    const r = await call('POST', '/auth/login', { email: email.value, password: password.value });
    token = r.status === 200 ? r.body.accessToken : null;
  };
  document.getElementById('health').onclick = () => call('GET', '/health');
  document.getElementById('policy').onclick = () => call('GET', '/policy');
</script>
</body>
</html>
